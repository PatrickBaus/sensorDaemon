[project]
name = "Kraken"
authors = [
  { name="Patrick Baus", email="patrick.baus@physik.tu-darmstadt.de" },
]
description = "Kraken. A sensor aggregation daemon."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE",
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Home Automation",
]
keywords = ["IoT", "PID", "PID controller",]
dynamic = ["dependencies", "version"]

[project.urls]
"Homepage" = "https://github.com/TU-Darmstadt-APQ/lab_temperature-Backend"
"Bug Tracker" = "https://github.com/TU-Darmstadt-APQ/lab_temperature-Backend/issues"
"Download" = "https://github.com/TU-Darmstadt-APQ/lab_temperature-Backend/releases"

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 120

[tool.pylint.'MAIN']
load-plugins = "pylint_pydantic"
init-hook='import sys; sys.path.append(".")'
# Generated by setuptools-scm
ignore = ["_version.py"]

[tool.pylint.'MISCELLANEOUS']
notes = ["FIXME",]

[tool.isort]
line_length = 120
profile = "black"

[tool.black]
line-length = 120

[tool.coverage.run]
branch = true
# python-coverage-comment-action needs relative paths in the .coverage file
relative_files = true
# Only the code of Kraken is measured, not the tests
source = ["."]
omit = ["tests/*", "_version.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    # Only evaluated by the type checker
    "if TYPE_CHECKING:",
    # The entry point of the daemon. Its parts are tested separately.
    'if __name__ == "__main__":',
    # Marks code after an endless loop, that only exists to tell mypy that the function does not return there
    'assert False, "unreachable"',
]

[tool.pytest.ini_options]
# Every test gets its own event loop
asyncio_default_fixture_loop_scope = "function"
markers = [
    # Tests, that take a second or longer, e.g. because they wait for a periodic check
    "slow",
]

[build-system]
requires = [
    "setuptools>=84.2.1",
    "setuptools-scm>=8.0",  # for version_file
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "black~=26.10.1",
    "blacken-docs~=1.20.0",
    "build~=1.6.1",
    "isort~=9.0.2",
    "pre_commit~=4.7.0",
    "types-simplejson~=4.3.0.20261112",
    {include-group = "lint"},
    {include-group = "version"},
]
lint = [
    "mypy~=2.4.1",
    "pylint~=4.1.4",
    "pylint-pydantic~=0.4.1",
]
# Writes _version.py from the git tag, see [tool.setuptools_scm]
version = [
    "setuptools-scm~=10.3.4",
]
test = [
    "mongomock-motor~=0.0.36",
    "pytest~=9.2.0",
    "pytest-asyncio~=1.5.0",
    "pytest-cov~=7.1.0",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools_scm]
# The version is taken from the git tag of the release, e.g. 4.7.0. Commits after a tag get a development version
# like 4.7.1.dev3. Kraken is not installed, so the version is written to _version.py by
# `python -m setuptools_scm --force-write-version-files` instead of during a build. That file is not tracked by git.
# The Docker image gets the version from the CI/CD pipeline as the build argument VERSION.
version_file = "_version.py"
# Leave out the "+g<commit hash>" local version part, like the libraries do. The commit of a Docker image is in its
# org.opencontainers.image.revision label.
local_scheme = "no-local-version"
